<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truck GPS">
<meta name="theme-color" content="#14181c">
<title>Truck GPS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
  :root{--bg:#14181c;--panel:#1d2329;--line:#323b44;--text:#eef2f5;--mute:#9aa7b2;--accent:#ffb000}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",sans-serif}
  html,body{overflow:hidden;position:fixed;width:100%;height:100%;overscroll-behavior:none}
  #map{position:absolute;inset:0;touch-action:none !important}
  button{font-family:inherit}

  /* search panel (top) */
  .top{position:absolute;z-index:1200;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px;pointer-events:none}
  .search{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:none;flex-direction:column;gap:6px}
  .search.open{display:flex;position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border:2px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
  .phead{display:flex;justify-content:space-between;align-items:center}
  .phead b{font-size:19px}
  .phead button{padding:8px 14px;border:0;border-radius:8px;background:var(--line);color:var(--text);font-size:15px;font-weight:600}
  .frow{display:flex;align-items:center;gap:8px}
  .frow label{width:78px;flex:none;font-weight:700;font-size:16px}
  .fld{position:relative;flex:1;min-width:0}
  .fld input{padding-right:46px !important}
  .fld input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;box-sizing:border-box;height:46px;line-height:20px;text-align:left;margin:0;font-family:inherit}
  .fld input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
  .fld input[type=datetime-local]::-webkit-datetime-edit{padding:0;text-align:left}
  .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:17px;background:var(--line);color:var(--text);font-size:15px}
  .sech{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;color:var(--mute);margin-top:2px}
  #pstat:empty{display:none}
  .sech button{border:0;background:none;color:var(--mute);font-size:13px}
  .plist{overflow-y:auto;-webkit-overflow-scrolling:touch}
  #savedList{max-height:150px;flex:none}
  .plist.hist{flex:1;min-height:0;touch-action:pan-y;overscroll-behavior:contain}
  .search{touch-action:manipulation}
  .pit{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .plist{margin-top:-3px}
  .pit .pt{flex:1;min-width:0}
  #histList .pit{min-height:56px}
  .pit .num{width:34px;flex:none;color:var(--mute);font-size:14px;text-align:left}
  .pit b{display:block;font-size:16px;white-space:normal;overflow-wrap:anywhere}
  .pit small{display:block;font-size:12px;color:var(--mute);white-space:normal;overflow-wrap:anywhere}
  .pit .px{border:0;background:var(--line);color:var(--text);width:34px;height:34px;border-radius:17px;font-size:15px;flex:none}
  .search input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  .row{display:flex;gap:6px}
  .row button{flex:1;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#1a1200}
  .row button.alt{background:var(--line);color:var(--text)}
  .sug{display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow-y:auto}
  .sug div{padding:12px;font-size:15px;border-bottom:1px solid var(--line)}
  .sug div:last-child{border-bottom:0}
  .haz{display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}
  .haz button{width:auto;padding:10px 18px;border:0;border-radius:8px;font-size:16px;font-weight:600;background:var(--line);color:var(--text)}
  .haz button.on{background:#e5484d;color:#fff}
  .truck{font-size:14px;color:var(--mute);display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  .truck b{color:var(--text)}
  .note{font-size:13px;color:var(--mute);line-height:1.35}

  /* button zones around the edges */
  .zone{position:absolute;z-index:1000;display:flex;gap:8px;pointer-events:none}
  .zone>*{pointer-events:auto}
  #colR,#colL{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);flex-direction:column}
  #colR{right:8px}
  #colL{left:8px}
  #rowT,#rowB{height:60px;flex-direction:row;justify-content:center}
  #rowT{left:80px;right:80px}
  #rowB{left:8px;right:8px}
  #rowT{top:calc(env(safe-area-inset-top,0px) + 8px)}
  #rowB{bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .fab{position:relative;flex:none;width:64px;height:60px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--text);font-size:19px;font-weight:500;line-height:1.1;padding:0 2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .fab small{display:block;font-size:11px;font-weight:600;color:var(--mute);margin-top:1px}
  .fab i{display:none;position:absolute;left:5px;top:2px;font-size:10px;font-style:normal;font-weight:600;color:var(--mute)}
  #colR .fab,#colL .fab{flex:1 1 0;height:auto;min-height:0}
  .fab.bad{background:#e5484d;border-color:#e5484d;color:#fff}
  .fab{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  @keyframes jig{0%{rotate:-.6deg}50%{rotate:.6deg}100%{rotate:-.6deg}}
  body.edit .fab{animation:jig .35s infinite}
  body.edit .fab:nth-child(even){animation-delay:-.17s}
  .fab.drag{animation:none !important;z-index:2000;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  #colR,#colL{width:64px;visibility:hidden}
  #btnLayer{position:fixed;inset:0;z-index:1000;pointer-events:none}
  #btnLayer .fab{position:absolute;left:0;top:0;width:64px;flex:none;pointer-events:auto;transition:transform .22s ease}
  #btnLayer.notrans .fab{transition:none}
  #btnLayer .fab.drag{transition:none;z-index:2000}
  #editDone{display:none;position:absolute;z-index:2500;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);padding:12px 22px;font-size:16px;font-weight:700;border:0;border-radius:22px;background:var(--accent);color:#1a1200}
  body.edit #editDone{display:block}
  .fab.empty{border-style:dashed;color:var(--mute);background:rgba(29,35,41,.8)}
  .fab.on{background:var(--accent);border-color:var(--accent);color:#1a1200}
  .fab.on small{color:#1a1200}
  #zinBtn .pl{font-size:19px;line-height:1}
  #zinBtn.show{background:#e5484d;border-color:#e5484d;color:#fff}
  .fab.lim{background:#fff;border-color:#fff;color:#111}
  #speedBtn{background:#e5484d;border-color:#e5484d;color:#fff}
  #wxBtn.on,#traBtn.on{background:#e5484d;border-color:#e5484d;color:#fff}
  #tripList .irow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
  #tripList .irow span{color:var(--mute)}
  #tripList .irow b{font-weight:700;text-align:right}
  #tripPop{overflow-y:auto}
  #gpsBtn,#gpsBtn.bad{background:var(--panel);border-color:var(--line);color:var(--text)}

  /* popups next to the column */
  .pop{display:none;position:absolute;z-index:1100;right:84px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:190px}
  .pop.open{display:block}
  .pop .opt{width:100%;padding:14px;margin:0 0 6px;font-size:17px;font-weight:600;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);text-align:left}
  .pop .opt:last-child{margin-bottom:0}
  .pop .opt.on{border-color:var(--accent);color:var(--accent)}
  #speedPop{text-align:center}
  #speedPop .ctl{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
  #speedPop .ctl button{width:56px;height:56px;font-size:30px;border-radius:12px;border:0;background:var(--accent);color:#1a1200;font-weight:700}
  #speedVal{font-size:26px;font-weight:700;min-width:96px}
  #speedPop .done{width:100%;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--line);color:var(--text)}

  #info{position:absolute;z-index:1000;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);height:calc(var(--bh,60px)*2 + 8px);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:0 12px;font-size:19px;font-weight:500;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  #info small{display:block;font-weight:500;color:var(--mute);font-size:14px;line-height:1.25}
  #info.route{flex-direction:column;align-items:flex-start;justify-content:center;padding:0 12px;font-size:19px;font-weight:500}
  #info.route .ln{display:flex;justify-content:flex-start;align-items:baseline;column-gap:.28em;line-height:1.04;height:1.04em;white-space:nowrap;letter-spacing:-.01em}
  #info.route .ln span{white-space:nowrap}
  #info.route .ln span.eta{color:#4da3ff}
  #wsBtn.bad{animation:blk 1s infinite}
  #info.route b{font-size:19px;font-weight:700;line-height:1.05;white-space:nowrap}
  #info.route small{font-size:12px;font-weight:600;color:var(--mute)}
  #turn{position:absolute;z-index:1000;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);height:calc(var(--bh,60px)*2 + 8px);background:var(--panel);border:2px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:14px;padding:0 14px;overflow:hidden}
  #turn .tl{display:flex;flex-direction:column;align-items:center;min-width:104px}
  #turn .ar{font-size:54px;line-height:1;color:var(--accent);font-weight:400}
  #turn .d{font-size:30px;font-weight:500;margin-top:2px;white-space:nowrap}
  #turn .t{flex:1;font-size:24px;font-weight:500;line-height:1.2;min-width:0;overflow:hidden}
  #wxPop{left:calc(var(--bh,60px) + 16px) !important;right:calc(var(--bh,60px) + 16px) !important;bottom:calc(env(safe-area-inset-bottom,0px) + var(--bh,60px)*2 + 24px) !important}
  #trkPop,#wxPop,#setPop,#infoPop,#tripPop{left:80px;right:80px;top:calc(env(safe-area-inset-top,0px) + var(--bh,60px)*2 + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + var(--bh,60px)*2 + 32px);transform:none;min-width:0;padding:8px;flex-direction:column;gap:6px;overflow:hidden}
  #trkPop.open,#wxPop.open,#setPop.open,#infoPop.open,#tripPop.open{display:flex}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1 1 auto;padding:9px 8px;font-size:14px;font-weight:700;border:2px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text)}
  .seg button.on{border-color:var(--accent);color:var(--accent)}
  #trkList,#wxList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
  #trkList .it,#wxList .it{padding:9px 4px;border-bottom:1px solid var(--line)}
  #trkList .it b,#wxList .it b{display:block;font-size:14px}
  #trkList .it small,#wxList .it small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
  #trkList .mapb{flex:none;border:0;border-radius:8px;background:var(--line);color:var(--text);padding:9px 11px;font-size:13px;font-weight:600}
  #trkClose,#setClose,#infoClose,#tripClose,#tripReset{width:100%;padding:11px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--line);color:var(--text)}
  #map.rot{transition:transform .6s linear}
  #attr{position:fixed;left:80px;right:80px;bottom:calc(env(safe-area-inset-bottom,0px) + var(--bh,60px)*2 + 20px);text-align:center;font-size:10px;color:#222;text-shadow:0 0 3px #fff,0 0 3px #fff;z-index:950;pointer-events:none}
  .arw{width:30px;height:30px}
  @keyframes blk{0%,49.99%{opacity:1}50%,100%{opacity:0}}
  .flash{animation:blk 1s infinite}
  #setPop,#infoPop{overflow-y:auto}
  #setPop input{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  #infoList .irow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
  #infoList .irow span{color:var(--mute)}
  #infoList .irow b{font-weight:700;text-align:right}
  #statusScrim{position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 14px);background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none;z-index:900}
  .me{width:18px;height:18px;border-radius:50%;background:#2f8cff;border:3px solid #fff;box-shadow:0 0 0 2px rgba(47,140,255,.4)}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="search" id="panel">
    <div class="frow"><label>Lat/Lon:</label><div class="fld"><input id="coord" placeholder="30.3322, -81.6557" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="clr" data-for="coord">✕</button></div></div>
    <div class="frow"><label>From:</label><div class="fld"><input id="from" placeholder="My location" autocomplete="off" autocapitalize="off"><button class="clr" data-for="from">✕</button></div></div>
    <div class="sug" id="sugFrom"></div>
    <div class="frow"><label>To:</label><div class="fld"><input id="to" placeholder="City or address" autocomplete="off"><button class="clr" data-for="to">✕</button></div></div>
    <div class="sug" id="sugTo"></div>
    <div class="frow"><label>Leave:</label><div class="fld"><input id="depT" type="datetime-local"><button class="clr" data-for="depT">✕</button></div></div>
    <div class="frow"><label>Arrive:</label><div class="fld"><input id="arrT" type="datetime-local"><button class="clr" data-for="arrT">✕</button></div></div>
    <div class="note" id="pstat"></div>
    <div class="sech"><span>Saved</span></div>
    <div class="plist" id="savedList"></div>
    <div class="sech"><span>History</span></div>
    <div class="plist hist" id="histList"></div>
    <div class="row">
      <button id="go">Route</button>
      <button id="savePlace" class="alt">Save</button>
      <button id="panelClose" class="alt">Close</button>
    </div>
  </div>
</div>

<div id="statusScrim"></div>
<div id="attr">© OpenStreetMap · HERE · OpenTopoMap · Esri · NWS · Open-Meteo</div>
<button id="editDone">Done · drag buttons</button>
<div id="info"></div>
<div id="turn"></div>
<div class="zone" id="colL"></div>
<div id="btnLayer"></div>
<div class="zone" id="colR"></div>

<div class="pop" id="layerPop">
  <button class="opt" data-l="streets">Streets</button>
  <button class="opt here" data-l="here" style="display:none">HERE</button>
  <button class="opt here" data-l="heretruck" style="display:none">HERE Truck</button>
  <button class="opt" data-l="osm">OSM</button>
  <button class="opt" data-l="topo">Terrain</button>
  <button class="opt" data-l="sat">Satellite</button>
</div>

<div class="pop" id="trkPop">
  <div class="seg" id="trkMode"><button data-m="route" class="on">Route</button><button data-m="near">Nearby</button></div>
  <div class="seg" id="trkBrand"><button data-b="all" class="on">All</button><button data-b="ta">TA/Petro</button><button data-b="pilot">Pilot/FJ</button><button data-b="love">Love's</button><button data-b="other">Other</button></div>
  <div class="note" id="trkStatus"></div>
  <div id="trkList"></div>
  <button id="trkClose">Close</button>
</div>

<div class="pop" id="setPop">
  <div class="note">Settings</div>
    <div class="haz"><span>Hazmat</span><button id="haz">No</button></div>
    <div class="truck">
      <span>Height <b>13'6"</b></span><span>Width <b>8'6"</b></span>
      <span>Trailer <b>53'</b></span><span>Weight <b>80,000 lb</b></span>
      <span>Steer <b>12,000</b></span><span>Drive <b>34,000</b></span>
      <span>Trailer axles <b>34,000</b></span><span>Axles <b>5 (18 tires)</b></span>
    </div>
    <input id="hereKey" placeholder="HERE API key (stays only on this phone)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="note" id="routeNote"></div>
  <div class="row"><button id="clear" class="alt">Clear route</button></div>
  <button id="setClose">Close</button>
</div>

<div class="pop" id="infoPop">
  <div class="note" id="infoHead">Information (live)</div>
  <div id="infoList"></div>
  <button id="infoClose">Close</button>
</div>

<div class="pop" id="tripPop">
  <div class="note">Trip counters</div>
  <div id="tripList"></div>
  <button id="tripReset" style="background:#e5484d;color:#fff">Reset trip</button>
  <button id="tripClose">Close</button>
</div>

<div class="pop" id="wxPop">
  <div class="note" id="wxHead">Weather on your route</div>
  <div id="wxList"></div>
</div>

<div class="pop" id="speedPop">
  <div class="note">Average speed for ETA</div>
  <div class="ctl">
    <button id="spMinus">−</button>
    <div id="speedVal">55 mph</div>
    <button id="spPlus">+</button>
  </div>
  <button class="done" id="spDone">Done</button>
</div>

<script>
(function(){
  var layer=document.getElementById('btnLayer'), zR=document.getElementById('colR'), zL=document.getElementById('colL');
  var done=document.getElementById('editDone'), body=document.body;
  var GAP=8, W=64, BW=52;
  var rr=zR.getBoundingClientRect();
  var NN=Math.max(8,Math.min(11,Math.floor((rr.height+8)/52)));
  var n=Math.max(7,NN-4);

  var specsR={
    0:{id:'layerBtn',html:'MAP',label:'Map type'},
    1:{id:'wxBtn',html:'WX',label:'Weather radar'},
    2:{id:'speedBtn',html:'<span id="speedTxt">55</span>',label:'Average speed'},
    3:{id:'wsBtn',key:'e4',html:'<span id="wsTxt">W<span style="color:#ff5a5f">--</span></span>',label:'Next weigh station'},
    4:{id:'raBtn',key:'e5',html:'<span id="raTxt">R<span style="color:#ff5a5f">--</span></span>',label:'Next rest area'},
    5:{id:'trkBtn',key:'e6',html:'POI',label:'Truck stops'}
  };
  var specsL={0:{id:'gpsBtn',html:'INF',label:'Information'}};
  specsL[1]={id:'zinBtn',key:'e9',html:'<span class="pl">+</span>',label:'Zoom in / back to my location'};
  specsL[2]={id:'zoutBtn',key:'e10',html:'<span id="scaleTxt">1</span>',label:'Zoom out (shows the scale)'};
  specsL[3]={id:'cmpBtn',key:'e11',html:'<span id="cmpTxt"><span style="color:#ff5a5f">N--</span></span>',label:'Heading / map rotation'};
  specsL[n-2]={id:'curSpd',key:'e13',html:'<span id="curSpdTxt" style="color:#ff5a5f">--</span>',label:'Current speed'};
  specsL[4]={id:'tripBtn',key:'e12',html:'TRI',label:'Trip counters'};
  specsL[n-1]={id:'setBtn',key:'menu',html:'SET',label:'Settings'};
  specsR[n-1]={id:'traBtn',key:'e14',html:'TRA',label:'Traffic on map'};

  var btns={}, def={R:[],L:[]}, num=1;
  ['R','L'].forEach(function(k){
    for(var i=0;i<n;i++){
      var spec=(k==='R'?specsR:specsL)[i];
      var b=document.createElement('button');
      var tag=document.createElement('i'); tag.textContent=num;
      b.className='fab';
      if(spec && spec.empty){ b.className='fab empty'; b.textContent=spec.text; }
      else if(spec){
        if(spec.id==='gpsBtn') b.className='fab bad';
        b.id=spec.id; b.setAttribute('aria-label',spec.label); b.innerHTML=spec.html; b.appendChild(tag);
      } else { b.className='fab empty'; b.textContent=num; }
      b.dataset.key=spec?(spec.key||spec.id):'e'+num;
      layer.appendChild(b);
      btns[b.dataset.key]=b; def[k].push(b.dataset.key);
      num++;
    }
  });
  var limEl = document.createElement('button');
  limEl.id = 'limBtn'; limEl.className = 'fab lim'; limEl.setAttribute('aria-label','Speed limit');
  limEl.innerHTML = '<span id="limTxt" style="color:#e5484d">--</span>';
  layer.appendChild(limEl);

  // restore saved layout
  var plan={R:def.R.slice(),L:def.L.slice()};
  // default order = the arrangement from the user's screenshot (used when nothing is saved on this phone/browser)
  var pref={
    L:['layerBtn','gpsBtn','menu','speedBtn','e12','e14','e13'],
    R:['e6','e4','e5','wxBtn','e11','e9','e10']

  layer.addEventListener('click',function(e){

  },true);

  function startDrag(b,x,y,pid,initial){

  }
  function nearest(x,y){
    var best=0,bd=1e12;
    slots.forEach(function(s,i){
      var dx=x-(s.x+BW/2), dy=y-(s.y+s.h/2), d=dx*dx+dy*dy;

  }
  function endDrag(){
    if(press){clearTimeout(press);press=null}

  }

  order.forEach(function(b){
    b.addEventListener('pointerdown',function(e){

      ps={x:e.clientX,y:e.clientY,id:e.pointerId};
      press=setTimeout(function(){
        press=null; setEdit(true); startDrag(b,ps.x,ps.y,ps.id,true);

    });
    b.addEventListener('pointermove',function(e){
      if(press&&Math.hypot(e.clientX-ps.x,e.clientY-ps.y)>10){clearTimeout(press);press=null}

    b.addEventListener('pointercancel',endDrag);

  });

    if(EDIT && !(e.target.closest && e.target.closest('.fab'))) setEdit(false);
  });
})();

  }
  var RDASH = '<span style="color:#ff5a5f">--</span>';

  function routeWindTxt(){

  // --- zoom buttons with scale label ---
  var LV = [['250 ft',250*0.3048],['500 ft',500*0.3048],['1 mi',1609.344],['2 mi',2*1609.344],['4 mi',4*1609.344],['8 mi',8*1609.344],['16 mi',16*1609.344],['32 mi',32*1609.344],['64 mi',64*1609.344],['128 mi',128*1609.344],['256 mi',256*1609.344]];

      if(name===null) return;
      places.unshift({name:(name.trim()||text),text:text,lat:q.lat,lng:q.lng});
      lsSet('places',places); renderLists(); pmsg('Saved.');
    }).catch(function(e){ pmsg(e.message) });
  };

  document.getElementById('go').onclick = function(){
    var fromI = document.getElementById('from'), toI = document.getElementById('to'), coordI = document.getElementById('coord');
    var fromQ = fromI.value.trim(), toQ = toI.value.trim(), coordQ = coordI.value.trim();
    if(!toQ && !coordQ){ pmsg('Enter a destination or coordinates'); return }
    var cc = coordQ ? parseCoord(coordQ) : null;
    if(coordQ && !cc){ pmsg('Coordinates look like 30.3322, -81.6557'); return }
    pmsg('Building route…'); setInfo('Building route…');
    var pFrom = fromQ ? getPoint(fromI) : Promise.resolve(pos);
    var pTo = cc ? Promise.resolve(L.latLng(cc[0],cc[1])) : getPoint(toI);
    var label = cc ? coordQ : toQ;
    Promise.all([pFrom, pTo]).then(function(r){
      if(!r[0]) throw new Error('No GPS fix yet, enter a From address');
      dest = r[1];
      if(destMarker) map.removeLayer(destMarker);
      destMarker = L.marker(dest).addTo(map);
      return fetchRoute(r[0], dest);
    }).then(function(route){
      draw(route,true);
      addHistory({text:label,lat:dest.lat,lng:dest.lng}); renderLists();
      if(route.warn) setInfo('Warning','This route violates a truck restriction');
      pmsg('');
      document.getElementById('panel').classList.remove('open');
    }).catch(function(e){ pmsg(e.message); setInfo('Error',e.message) });
  };

  document.getElementById('clear').onclick = function(){
    if(routeLine) map.removeLayer(routeLine);
    if(destMarker) map.removeLayer(destMarker);
    routeLine=null;destMarker=null;dest=null;routeMeta=null;routePts=[];tollSegs=[];
    stations=[]; rests=[]; setWs('W--',null); setRa('R--');
    mans=[]; updateTurn(); wxItems=[]; wxState='none'; wxWindWorst=null; wxWinds=[]; destTempF=null;
    setInfo('Route cleared');
  };

  // reroute if off the route
  var lastReroute = 0;
  function checkOffRoute(){
    if(!routeLine||!pos||!dest||rerouting) return;
    if(document.getElementById('from').value.trim()) return;
    var min = Infinity;
    for(var i=0;i<routePts.length;i++){var d=pos.distanceTo(routePts[i]); if(d<min)min=d}
    if(min>150 && Date.now()-lastReroute>20000){
      rerouting = true; lastReroute = Date.now();
      setInfo('Rerouting…');
      fetchRoute(pos,dest).then(function(r){draw(r,false)}).catch(function(){}).then(function(){rerouting=false});
    }
  }
})();
</script>
</body>
</html>
